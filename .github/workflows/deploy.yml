name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'consultation-app' }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'consultation-app' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::890886303710:role/github-actions-consultation-app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update Lambda function code
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI"
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Sync Lambda environment variables
        env:
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess

          required = [
              "CLERK_JWKS_URL",
              "OPENAI_API_KEY",
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")

          variables = {
              "CLERK_JWKS_URL": os.environ["CLERK_JWKS_URL"],
              "OPENAI_API_KEY": os.environ["OPENAI_API_KEY"],
              "UPSTASH_REDIS_REST_URL": os.environ["UPSTASH_REDIS_REST_URL"],
              "UPSTASH_REDIS_REST_TOKEN": os.environ["UPSTASH_REDIS_REST_TOKEN"],
              "DYNAMODB_TABLE": "consultation-app",
              "S3_EXPORTS_BUCKET": "consultation-app-exports-890886303710",
              "RATE_LIMIT_LIFETIME": "2",
              "PROMPT_VERSION": "v2",
              "MODEL_NAME": "gpt-5-nano",
              "AWS_LWA_INVOKE_MODE": "response_stream",
              "PORT": "8000",
          }
          payload = json.dumps({"Variables": variables})
          subprocess.check_call(
              [
                  "aws",
                  "lambda",
                  "update-function-configuration",
                  "--function-name",
                  os.environ["LAMBDA_FUNCTION_NAME"],
                  "--environment",
                  payload,
              ]
          )
          PY
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
